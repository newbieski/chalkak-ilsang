<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>찰칵일상 · 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 디자인 토큰 — ui-ux-pro-max 스킬 "Soft UI Evolution" 결과 (DESIGN.md 참고) */
  :root {
    --color-primary: #92400E;
    --color-secondary: #A16207;
    --color-accent: #6366F1;
    --color-on-accent: #FFFFFF;
    --color-background: #FFFBEB;
    --color-foreground: #0F172A;
    --color-card: #FFFFFF;
    --color-muted: #F8F3F0;
    --color-muted-foreground: #475569;
    --color-border: #F1E8E2;
    --color-success: #16a34a;
    --color-destructive: #DC2626;
    --color-ring: #92400E;
    --font-heading: 'Caveat', cursive;
    --font-body: 'Quicksand', system-ui, sans-serif;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-soft: 0 2px 10px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.05);
    --transition: 200ms ease;
  }

  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--color-background);
    color: var(--color-foreground);
    max-width: 900px; margin: 2rem auto; padding: 0 1rem;
    line-height: 1.5;
  }
  h1 {
    font-family: var(--font-heading); font-weight: 700; font-size: 2.4rem;
    color: var(--color-primary); margin-bottom: 0.25rem;
  }
  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.35rem; }
  p { color: var(--color-muted-foreground); }

  a { color: var(--color-accent); }

  #photos { display: flex; flex-wrap: wrap; gap: 10px; margin: 1rem 0; }
  .photo-item { text-align: center; position: relative; width: 110px; }
  .photo-item img {
    width: 110px; height: 110px; object-fit: cover; border-radius: var(--radius-sm);
    cursor: pointer; display: block; box-shadow: var(--shadow-soft);
    transition: box-shadow var(--transition), transform var(--transition);
  }
  .photo-item img:hover { transform: translateY(-2px); }
  .photo-item img.selected { box-shadow: 0 0 0 3px var(--color-accent), var(--shadow-soft); }
  .photo-item img:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
  .photo-item .badge {
    position: absolute; top: 6px; right: 6px; font-size: 0.7rem; padding: 2px 8px;
    border-radius: 999px; color: #fff; font-weight: 600;
  }
  .badge.done { background: var(--color-success); }
  .badge.todo { background: var(--color-muted-foreground); }
  .id-label { font-size: 0.7rem; color: var(--color-muted-foreground); margin-top: 4px; }

  input[type="text"], textarea {
    width: 100%; padding: 0.6rem 0.75rem; font-size: 1rem; box-sizing: border-box;
    font-family: inherit; color: var(--color-foreground); background: var(--color-card);
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  input[type="text"]:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--color-ring); box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.15);
  }
  textarea { resize: vertical; }
  button {
    padding: 0.6rem 1.1rem; margin-top: 0.5rem; cursor: pointer; font-family: inherit;
    font-size: 0.95rem; font-weight: 600; border: none; border-radius: var(--radius-sm);
    background: var(--color-accent); color: var(--color-on-accent);
    transition: filter var(--transition), transform var(--transition);
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
  label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: var(--color-muted-foreground); font-weight: 600; }

  #panel, #tone-section {
    margin-top: 1.5rem; padding: 1.25rem; background: var(--color-card);
    border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow-soft);
  }
  #panel-photo { max-width: 100%; max-height: 320px; display: block; margin: 0 auto 0.75rem; border-radius: var(--radius); box-shadow: var(--shadow-soft); }
  #panel-status { font-size: 0.9rem; }
  #panel-status.done { color: var(--color-success); }
  #panel-status.todo { color: var(--color-muted-foreground); }
  #panel-msg { font-size: 0.85rem; color: var(--color-accent); min-height: 1.2em; font-weight: 600; }
  #deselect { background: var(--color-card); color: var(--color-foreground); border: 1px solid var(--color-border); }

  #tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.4rem; min-height: 1.6rem; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 4px; background: var(--color-muted); color: var(--color-primary);
    border-radius: 999px; padding: 3px 8px 3px 12px; font-size: 0.85rem; font-weight: 500;
  }
  .tag-chip button { margin: 0; padding: 0 2px; background: none; border: none; color: var(--color-primary); font-weight: bold; cursor: pointer; }
  .tag-chip button:hover { filter: none; color: var(--color-destructive); }
  .tag-add-row { display: flex; gap: 6px; margin-top: 0.4rem; }
  .tag-add-row input { flex: 1; }
  .tag-add-row button { margin-top: 0; white-space: nowrap; }

  #tone-samples-list { margin-top: 0.4rem; }
  .tone-sample-row { display: flex; align-items: flex-start; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--color-border); }
  .tone-sample-row span { flex: 1; font-size: 0.9rem; }
  .tone-sample-row button { margin: 0; background: none; border: none; color: var(--color-destructive); cursor: pointer; font-size: 0.85rem; font-weight: 500; }
  .tone-sample-row button:hover { filter: none; text-decoration: underline; }
  #tone-section p.hint { font-size: 0.85rem; color: var(--color-muted-foreground); margin: 0.25rem 0 0; }

  #general { margin-top: 1.5rem; }
  #selected-info { color: var(--color-accent); font-size: 0.9rem; min-height: 1.2em; font-weight: 600; }
  #result { margin-top: 1rem; }
  #result pre {
    background: var(--color-muted); color: var(--color-foreground); padding: 0.75rem;
    border-radius: var(--radius-sm); white-space: pre-wrap; word-break: break-word;
  }
  #answer {
    font-size: 1.05rem; padding: 0.9rem 1rem; background: var(--color-muted);
    border-left: 3px solid var(--color-accent); border-radius: var(--radius-sm);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <h1>찰칵일상 · 데모 (PoC)</h1>
  <p>사진을 클릭하면 문장(캡션) 생성·수정 화면이 뜹니다. 초록 배지는 이미 문장이 있는 사진입니다.</p>

  <button id="sync-photos">새 사진 불러오기</button>
  <span id="sync-msg" style="font-size:0.85rem; color:var(--color-accent); margin-left:8px;"></span>

  <div id="photos">불러오는 중...</div>

  <!-- 사진을 고른 뒤: 요청(또는 기본값) → 생성 → 수정 → 확정 -->
  <div id="panel" hidden>
    <img id="panel-photo" src="" alt="선택된 사진" />
    <h2 id="panel-title"></h2>
    <p id="panel-status"></p>

    <label>태그</label>
    <div id="tags-list"></div>
    <div class="tag-add-row">
      <input id="new-tag" type="text" placeholder="태그 추가 후 Enter" />
      <button id="add-tag">추가</button>
    </div>

    <label>생성 요청 (제시된 문구를 그대로 쓰거나 원하는 대로 고쳐서 사용)</label>
    <input id="guide" type="text" />
    <button id="generate">문장 생성</button>

    <label>캡션 (직접 수정 가능)</label>
    <textarea id="caption-box" rows="4" placeholder="아직 생성된 문장이 없습니다."></textarea>
    <button id="confirm">확정</button>
    <button id="deselect">사진 선택 해제</button>
    <p id="panel-msg"></p>
  </div>

  <!-- 커스텀 톤(내 문체) 등록 — 사진 선택과 무관한 전역 설정 -->
  <div id="tone-section">
    <h2>내 문체 등록</h2>
    <p class="hint">평소 쓰는 글 샘플을 등록해두면, 캡션 생성 요청 시 "내가 등록한 톤으로"라고 말해서 그 문체로 받을 수 있습니다.</p>
    <div id="tone-samples-list"></div>
    <div class="tag-add-row">
      <input id="new-tone-sample" type="text" placeholder="본인 글 샘플 한 문장 입력 후 Enter" />
      <button id="add-tone-sample">추가</button>
    </div>
  </div>

  <!-- 사진을 고르지 않았을 때: 사진 검색 -->
  <div id="general">
    <h2>사진 검색</h2>
    <div id="selected-info">원하는 사진을 자연어로 설명해서 찾아보세요</div>
    <input id="question" type="text" placeholder="예: 바다 사진 보여줘" />
    <button id="send">검색</button>
    <div id="result"></div>
  </div>

<script>
let photosById = {};
let selectedId = null;
const DEFAULT_GUIDE = '2문장으로, 담백한 사실 설명 톤으로 써줘';

async function loadPhotos() {
  const res = await fetch('/data/photos.json');
  const photos = await res.json();
  photosById = Object.fromEntries(photos.map(p => [p.id, p]));
  renderPhotos();
}

async function syncPhotos() {
  const msgEl = document.getElementById('sync-msg');
  msgEl.textContent = '확인 중...';
  try {
    const res = await fetch('/photos/sync', { method: 'POST' });
    const added = await res.json();
    if (added.length) {
      msgEl.textContent = `${added.length}장 새로 등록됨: ${added.map(p => p.id).join(', ')}`;
    } else {
      msgEl.textContent = '새로 등록할 사진 없음';
    }
    await loadPhotos();
  } catch (err) {
    msgEl.textContent = `실패: ${err}`;
  }
}

function renderPhotos() {
  const container = document.getElementById('photos');
  container.innerHTML = '';
  Object.values(photosById).forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-item';

    const img = document.createElement('img');
    img.src = `/data/${p.filename}`;
    img.alt = p.caption || `사진 ${p.id}`;
    img.tabIndex = 0;
    img.setAttribute('role', 'button');
    if (p.id === selectedId) img.classList.add('selected');
    img.onclick = () => selectPhoto(p.id);
    img.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectPhoto(p.id); }
    };

    const badge = document.createElement('span');
    const done = !!p.caption;
    badge.className = 'badge ' + (done ? 'done' : 'todo');
    badge.textContent = done ? '완료' : '미작업';

    const label = document.createElement('div');
    label.className = 'id-label';
    label.textContent = p.id;

    wrap.appendChild(img);
    wrap.appendChild(badge);
    wrap.appendChild(label);
    container.appendChild(wrap);
  });
}

function selectPhoto(id) {
  selectedId = id;
  renderPhotos();
  showPanel();
}

function showPanel() {
  document.getElementById('general').hidden = true;
  const panel = document.getElementById('panel');
  panel.hidden = false;

  const photo = photosById[selectedId];
  document.getElementById('panel-photo').src = `/data/${photo.filename}`;
  document.getElementById('panel-title').textContent = `선택된 사진: ${selectedId}`;
  const statusEl = document.getElementById('panel-status');
  const done = !!photo.caption;
  statusEl.textContent = done ? '이미 문장이 생성된 사진입니다 (다시 생성하거나 바로 고칠 수 있습니다)' : '아직 문장을 생성하지 않은 사진입니다';
  statusEl.className = done ? 'done' : 'todo';

  document.getElementById('guide').value = DEFAULT_GUIDE;
  document.getElementById('caption-box').value = photo.caption || '';
  document.getElementById('panel-msg').textContent = '';
  document.getElementById('new-tag').value = '';
  renderTags();
}

function renderTags() {
  const photo = photosById[selectedId];
  const container = document.getElementById('tags-list');
  container.innerHTML = '';
  (photo.tags || []).forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    const text = document.createElement('span');
    text.textContent = tag;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.onclick = () => removeTag(tag);
    chip.appendChild(text);
    chip.appendChild(removeBtn);
    container.appendChild(chip);
  });
  if (!(photo.tags || []).length) {
    container.innerHTML = '<span style="color:var(--color-muted-foreground); font-size:0.85rem;">태그 없음</span>';
  }
}

async function saveTags(tags) {
  const msgEl = document.getElementById('panel-msg');
  try {
    const res = await fetch(`/photos/${selectedId}/tags`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tags }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const updated = await res.json();
    photosById[selectedId] = updated;
    renderTags();
  } catch (err) {
    msgEl.textContent = `태그 저장 실패: ${err}`;
  }
}

function addTag() {
  const input = document.getElementById('new-tag');
  const value = input.value.trim();
  if (!value) return;
  const photo = photosById[selectedId];
  const tags = photo.tags || [];
  if (tags.includes(value)) { input.value = ''; return; }
  saveTags([...tags, value]);
  input.value = '';
}

function removeTag(tag) {
  const photo = photosById[selectedId];
  const tags = (photo.tags || []).filter(t => t !== tag);
  saveTags(tags);
}

function deselect() {
  selectedId = null;
  document.getElementById('panel').hidden = true;
  document.getElementById('general').hidden = false;
  renderPhotos();
}

async function generateCaption() {
  const guide = document.getElementById('guide').value.trim();
  const request = guide || DEFAULT_GUIDE;
  const msgEl = document.getElementById('panel-msg');
  msgEl.textContent = '생성 중...';

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: `${selectedId}::${request}` }),
    });
    const data = await res.json();
    document.getElementById('caption-box').value = data.answer ?? '';
    msgEl.textContent = '생성됨 — 내용을 확인·수정한 뒤 확정을 눌러주세요 (아직 저장 전입니다)';
  } catch (err) {
    msgEl.textContent = `생성 실패: ${err}`;
  }
}

async function confirmCaption() {
  const caption = document.getElementById('caption-box').value;
  const msgEl = document.getElementById('panel-msg');
  msgEl.textContent = '저장 중...';

  try {
    const res = await fetch(`/photos/${selectedId}/caption`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const updated = await res.json();
    photosById[selectedId] = updated;
    msgEl.textContent = '확정 저장됨';
    renderPhotos();
    showPanel();
  } catch (err) {
    msgEl.textContent = `저장 실패: ${err}`;
  }
}

async function sendGeneralQuery() {
  const text = document.getElementById('question').value.trim();
  if (!text) return;

  const resultEl = document.getElementById('result');
  resultEl.innerHTML = '<p>요청 중...</p>';

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text }),
    });
    const data = await res.json();
    const mentionedIds = [...new Set((data.answer ?? '').match(/p\d{3}/g) || [])];
    const thumbsHtml = mentionedIds
      .filter(id => photosById[id])
      .map(id => `
        <div style="display:inline-block; text-align:center; margin: 0 8px 8px 0;">
          <img src="/data/${photosById[id].filename}" alt="${photosById[id].caption || id}" style="width:100px; height:100px; object-fit:cover; border-radius:10px; box-shadow:var(--shadow-soft); display:block;" />
          <span style="font-size:0.7rem; color:var(--color-muted-foreground);">${id}</span>
        </div>
      `)
      .join('');

    resultEl.innerHTML = `
      <div id="answer"><strong>answer</strong><br>${data.answer ?? ''}</div>
      ${thumbsHtml ? `<div style="margin-top:0.75rem;">${thumbsHtml}</div>` : ''}
      <p><strong>contexts</strong></p>
      <pre>${JSON.stringify(data.contexts ?? [], null, 2)}</pre>
      <p><strong>trace</strong></p>
      <pre>${JSON.stringify(data.trace ?? [], null, 2)}</pre>
    `;
  } catch (err) {
    resultEl.innerHTML = `<p style="color:var(--color-destructive)">요청 실패: ${err}</p>`;
  }
}

document.getElementById('generate').addEventListener('click', generateCaption);
document.getElementById('confirm').addEventListener('click', confirmCaption);
document.getElementById('deselect').addEventListener('click', deselect);
document.getElementById('add-tag').addEventListener('click', addTag);
document.getElementById('new-tag').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTag();
});
document.getElementById('send').addEventListener('click', sendGeneralQuery);
document.getElementById('question').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendGeneralQuery();
});

let toneSamples = [];

async function loadTones() {
  const res = await fetch('/tones');
  const tones = await res.json();
  toneSamples = tones.custom.samples || [];
  renderToneSamples();
}

function renderToneSamples() {
  const container = document.getElementById('tone-samples-list');
  container.innerHTML = '';
  if (!toneSamples.length) {
    container.innerHTML = '<span style="color:var(--color-muted-foreground); font-size:0.85rem;">등록된 샘플 없음 — 등록 전까지는 기본 톤으로 처리됩니다.</span>';
    return;
  }
  toneSamples.forEach((sample, idx) => {
    const row = document.createElement('div');
    row.className = 'tone-sample-row';
    const text = document.createElement('span');
    text.textContent = sample;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '삭제';
    removeBtn.onclick = () => removeToneSample(idx);
    row.appendChild(text);
    row.appendChild(removeBtn);
    container.appendChild(row);
  });
}

async function saveToneSamples() {
  const res = await fetch('/tones/custom', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ samples: toneSamples }),
  });
  const tones = await res.json();
  toneSamples = tones.custom.samples || [];
  renderToneSamples();
}

function addToneSample() {
  const input = document.getElementById('new-tone-sample');
  const value = input.value.trim();
  if (!value) return;
  toneSamples = [...toneSamples, value];
  input.value = '';
  saveToneSamples();
}

function removeToneSample(idx) {
  toneSamples = toneSamples.filter((_, i) => i !== idx);
  saveToneSamples();
}

document.getElementById('add-tone-sample').addEventListener('click', addToneSample);
document.getElementById('new-tone-sample').addEventListener('keydown', e => {
  if (e.key === 'Enter') addToneSample();
});
document.getElementById('sync-photos').addEventListener('click', syncPhotos);

loadPhotos();
loadTones();
</script>
</body>
</html>
