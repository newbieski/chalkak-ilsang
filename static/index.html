<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>찰칵일상 · 데모</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  #photos { display: flex; flex-wrap: wrap; gap: 8px; margin: 1rem 0; }
  #photos img { width: 110px; height: 110px; object-fit: cover; border: 3px solid transparent; border-radius: 6px; cursor: pointer; }
  #photos img.selected { border-color: #2563eb; }
  #photos .id-label { font-size: 0.7rem; text-align: center; color: #666; }
  .photo-item { text-align: center; }
  #question { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-top: 0.5rem; cursor: pointer; }
  #selected-info { color: #2563eb; font-size: 0.9rem; min-height: 1.2em; }
  #result { margin-top: 1.5rem; }
  #result pre { background: #f5f5f5; padding: 0.75rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  #answer { font-size: 1.05rem; padding: 0.75rem; background: #eef6ff; border-radius: 6px; }
</style>
</head>
<body>
  <h1>찰칵일상 · 데모 (PoC)</h1>
  <p>사진을 클릭해서 고른 뒤(선택 안 해도 됨), 요청을 적고 전송하세요.</p>

  <div id="photos">불러오는 중...</div>
  <div id="selected-info"></div>

  <input id="question" type="text" placeholder="예: 담백하게 2문장으로 써줘 / 바다 사진 보여줘" />
  <button id="send">전송</button>

  <div id="result"></div>

<script>
let selectedId = null;

async function loadPhotos() {
  const res = await fetch('/data/photos.json');
  const photos = await res.json();
  const container = document.getElementById('photos');
  container.innerHTML = '';
  photos.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-item';
    const img = document.createElement('img');
    img.src = `/data/${p.filename}`;
    img.dataset.id = p.id;
    img.onclick = () => selectPhoto(p.id, img);
    const label = document.createElement('div');
    label.className = 'id-label';
    label.textContent = p.id;
    wrap.appendChild(img);
    wrap.appendChild(label);
    container.appendChild(wrap);
  });
}

function selectPhoto(id, imgEl) {
  if (selectedId === id) {
    // 같은 사진 다시 클릭하면 선택 해제
    selectedId = null;
    imgEl.classList.remove('selected');
  } else {
    document.querySelectorAll('#photos img').forEach(el => el.classList.remove('selected'));
    selectedId = id;
    imgEl.classList.add('selected');
  }
  updateSelectedInfo();
}

function updateSelectedInfo() {
  document.getElementById('selected-info').textContent = selectedId
    ? `선택된 사진: ${selectedId}`
    : '선택된 사진 없음 (검색 등 사진 지정이 필요 없는 요청에 사용)';
}

async function send() {
  const text = document.getElementById('question').value.trim();
  if (!text) return;
  const question = selectedId ? `${selectedId}::${text}` : text;

  const resultEl = document.getElementById('result');
  resultEl.innerHTML = '<p>요청 중...</p>';

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    resultEl.innerHTML = `
      <div id="answer"><strong>answer</strong><br>${data.answer ?? ''}</div>
      <p><strong>contexts</strong></p>
      <pre>${JSON.stringify(data.contexts ?? [], null, 2)}</pre>
      <p><strong>trace</strong></p>
      <pre>${JSON.stringify(data.trace ?? [], null, 2)}</pre>
    `;
  } catch (err) {
    resultEl.innerHTML = `<p style="color:red">요청 실패: ${err}</p>`;
  }
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('question').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

loadPhotos();
</script>
</body>
</html>
