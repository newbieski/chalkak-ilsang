<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>찰칵일상 · 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap">
<style>
/* Hallmark · macrostructure: Portfolio Grid (adapted — single-view utility tool, no marketing chrome)
 * theme: custom · vibe: "quiet warm paper journal, soft ink, unhurried" · paper: oklch(94% 0.014 70) · accent: oklch(44% 0.13 35)
 * display: Newsreader (roman) · body: Switzer · axes: light / roman-serif / warm
 * studied: no · context: explicit (DESIGN.md 방향, redesign verb) · v1.1.0
 * pre-emit critique: P4 H4 E4 S4 R5 V4
 */
:root {
  --color-paper: oklch(94% 0.014 70);
  --color-paper-2: oklch(91% 0.016 70);
  --color-ink: oklch(20% 0.012 60);
  --color-ink-2: oklch(38% 0.012 60);
  --color-rule: oklch(80% 0.014 70);
  --color-rule-2: oklch(87% 0.012 70);
  --color-muted: oklch(44% 0.012 60);
  --color-accent: oklch(44% 0.13 35);
  --color-accent-ink: oklch(97% 0.010 70);
  --color-focus: oklch(40% 0.20 35);
  --color-danger: oklch(42% 0.18 25);

  --font-display: "Newsreader", ui-serif, Georgia, serif;
  --font-body: "Switzer", ui-sans-serif, system-ui, sans-serif;

  --space-3xs: 0.125rem; --space-2xs: 0.25rem; --space-xs: 0.5rem; --space-sm: 0.75rem;
  --space-md: 1rem; --space-lg: 1.5rem; --space-xl: 2rem; --space-2xl: 3rem; --space-3xl: 4rem;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

  --radius-sm: 4px;
  --radius-md: 8px;
}

html { overflow-x: clip; background: var(--color-paper); }
body { overflow-x: clip; }
* { box-sizing: border-box; }

body {
  font-family: var(--font-body);
  font-weight: 400;
  background:
    radial-gradient(ellipse 120% 90% at 12% -10%, oklch(97% 0.014 75 / 0.6), transparent 55%),
    radial-gradient(ellipse 100% 80% at 100% 110%, oklch(89% 0.016 65 / 0.5), transparent 55%),
    var(--color-paper);
  background-attachment: fixed;
  color: var(--color-ink);
  line-height: 1.6;
  margin: 0 auto;
  padding: var(--space-2xl) var(--space-lg) var(--space-3xl);
  max-width: 40rem;
}

h1 {
  font-family: var(--font-display); font-style: normal; font-weight: 600;
  font-size: clamp(1.75rem, 2.5vw + 1rem, 2.5rem); line-height: 1.15; letter-spacing: -0.01em;
  color: var(--color-ink); margin: 0 0 var(--space-xs); overflow-wrap: anywhere;
}
h2 {
  font-family: var(--font-display); font-style: normal; font-weight: 600;
  font-size: 1.25rem; color: var(--color-ink); margin: 0 0 var(--space-sm); overflow-wrap: anywhere;
  display: flex; align-items: center; gap: var(--space-xs);
}
h2::before {
  content: ""; display: inline-block; width: 7px; height: 7px; flex: none;
  background: var(--color-accent); border-radius: 1px; transform: rotate(45deg);
}
p { color: var(--color-ink-2); margin: 0 0 var(--space-md); max-width: 62ch; }
header.intro { margin-bottom: var(--space-lg); }
.dateline {
  font-size: 0.75rem; font-weight: 500; letter-spacing: 0.04em; color: var(--color-muted);
  margin: 0 0 var(--space-xs);
}
h1 .eyebrow {
  display: inline-block; font-family: var(--font-body); font-weight: 500; font-size: 0.75rem;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted);
  vertical-align: middle; margin-left: var(--space-sm);
}

.section-rule { border: none; border-top: 1px solid var(--color-rule); margin: var(--space-2xl) 0 0; }

label {
  display: block; margin: var(--space-md) 0 var(--space-2xs);
  font-size: 0.8125rem; font-weight: 500; color: var(--color-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}

input[type="text"], textarea {
  width: 100%; padding: var(--space-sm) var(--space-md); font-size: 1rem; font-family: inherit;
  color: var(--color-ink); background: var(--color-paper-2);
  border: 1px solid var(--color-rule); border-radius: var(--radius-sm);
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
input[type="text"] { line-height: 1.2; }
textarea { resize: vertical; min-height: 5rem; line-height: 1.6; }
input[type="text"]:focus-visible, textarea:focus-visible {
  border-color: var(--color-focus); outline: 2px solid var(--color-focus); outline-offset: 1px;
}

button {
  font-family: var(--font-body); font-weight: 500; font-size: 0.9375rem; line-height: 1.2;
  padding: var(--space-sm) var(--space-md); margin-top: var(--space-sm);
  border-radius: var(--radius-sm); border: 1px solid var(--color-accent);
  background: transparent; color: var(--color-accent); cursor: pointer;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out), transform 160ms var(--ease-out);
}
button:hover { background: var(--color-accent); color: var(--color-accent-ink); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

#deselect, #add-tag, #add-tone-sample {
  border-color: var(--color-rule); color: var(--color-ink-2);
}
#deselect:hover, #add-tag:hover, #add-tone-sample:hover { background: var(--color-paper-2); color: var(--color-ink); }

#photos {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  gap: var(--space-md) var(--space-sm); margin: var(--space-lg) 0 0;
}
.photo-item {
  position: relative; min-width: 0;
  background: var(--color-paper); padding: var(--space-2xs) var(--space-2xs) var(--space-xs);
  border-radius: var(--radius-sm); box-shadow: 0 1px 3px oklch(20% 0.01 60 / 0.12);
  transition: transform 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
}
.photo-item:nth-child(3n+1) { transform: rotate(-0.6deg); }
.photo-item:nth-child(3n+2) { transform: rotate(0.7deg); }
.photo-item:nth-child(3n) { transform: rotate(-0.3deg); }
.photo-item:hover, .photo-item:focus-within {
  transform: rotate(0deg) translateY(-3px);
  box-shadow: 0 8px 18px oklch(20% 0.01 60 / 0.18);
}
.photo-item img {
  width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 2px;
  display: block; cursor: pointer; filter: saturate(0.97);
}
.photo-item img.selected { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.photo-item img:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.photo-item .badge {
  position: absolute; top: var(--space-sm); right: var(--space-sm);
  font-size: 0.625rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px; color: var(--color-paper);
}
.badge.done { background: oklch(44% 0.12 145); }
.badge.todo { background: oklch(42% 0.012 60); }
.id-label { font-size: 0.6875rem; color: var(--color-muted); margin-top: var(--space-2xs); text-align: center; }

#panel, #tone-section, #general { margin-top: var(--space-2xl); }
#panel-photo {
  max-width: 100%; max-height: 22rem; display: block; margin: 0 0 var(--space-md);
  border-radius: var(--radius-md); object-fit: cover;
}
#panel-status { font-size: 0.875rem; }
#panel-status.done { color: oklch(42% 0.10 145); }
#panel-status.todo { color: var(--color-muted); }
#panel-msg { font-size: 0.8125rem; color: var(--color-accent); min-height: 1.2em; font-weight: 500; margin-top: var(--space-sm); }

#tags-list { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-2xs); min-height: 1.6rem; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px; background: transparent; color: var(--color-ink-2);
  border: 1px solid var(--color-rule); border-radius: 999px; padding: 2px 6px 2px 10px; font-size: 0.8125rem;
}
.tag-chip button { margin: 0; padding: 0 2px; border: none; background: none; color: var(--color-muted); font-weight: bold; cursor: pointer; }
.tag-chip button:hover { background: none; color: var(--color-danger); }
.tag-add-row { display: flex; gap: var(--space-xs); margin-top: var(--space-2xs); align-items: center; }
.tag-add-row input { flex: 1; min-width: 0; }
.tag-add-row button { margin-top: 0; white-space: nowrap; }

#tone-section p.hint { font-size: 0.875rem; color: var(--color-muted); max-width: 60ch; }
#tone-samples-list { margin-top: var(--space-xs); }
.tone-sample-row { display: flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-sm) 0; border-top: 1px solid var(--color-rule-2); }
.tone-sample-row:first-child { border-top: none; }
.tone-sample-row span { flex: 1; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; }
.tone-sample-row button { margin: 0; border: none; background: none; color: var(--color-danger); font-size: 0.8125rem; font-weight: 500; padding: 0; }
.tone-sample-row button:hover { background: none; text-decoration: underline; }

#selected-info { color: var(--color-accent); font-size: 0.9375rem; min-height: 1.2em; font-weight: 500; margin-bottom: var(--space-sm); }
#result { margin-top: var(--space-lg); }
#result pre {
  background: var(--color-paper-2); color: var(--color-ink-2); padding: var(--space-md);
  border-radius: var(--radius-sm); white-space: pre-wrap; word-break: break-word; font-size: 0.8125rem;
  border: 1px solid var(--color-rule-2);
}
#answer { font-size: 1.0625rem; padding-left: var(--space-md); border-left: 3px solid var(--color-accent); color: var(--color-ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media (max-width: 480px) {
  body { padding-left: var(--space-md); padding-right: var(--space-md); }
  #photos { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
}
</style>
</head>
<body>
  <header class="intro">
    <p class="dateline" id="dateline"></p>
    <h1>찰칵일상 <span class="eyebrow">데모 · PoC</span></h1>
    <p>사진을 클릭하면 문장(캡션) 생성·수정 화면이 뜹니다. 초록 배지는 이미 문장이 있는 사진입니다.</p>
  </header>

  <button id="sync-photos">새 사진 불러오기</button>
  <span id="sync-msg" style="font-size:0.85rem; color:var(--color-accent); margin-left:8px;"></span>

  <div id="photos">불러오는 중...</div>

  <hr class="section-rule">

  <!-- 사진을 고른 뒤: 요청(또는 기본값) → 생성 → 수정 → 확정 -->
  <div id="panel" hidden>
    <img id="panel-photo" src="" alt="선택된 사진" />
    <h2 id="panel-title"></h2>
    <p id="panel-status"></p>

    <label>태그</label>
    <div id="tags-list"></div>
    <div class="tag-add-row">
      <input id="new-tag" type="text" placeholder="태그 추가 후 Enter" />
      <button id="add-tag">추가</button>
    </div>

    <label>생성 요청 (제시된 문구를 그대로 쓰거나 원하는 대로 고쳐서 사용)</label>
    <input id="guide" type="text" />
    <button id="generate">문장 생성</button>

    <label>캡션 (직접 수정 가능)</label>
    <textarea id="caption-box" rows="4" placeholder="아직 생성된 문장이 없습니다."></textarea>
    <button id="confirm">확정</button>
    <button id="deselect">사진 선택 해제</button>
    <p id="panel-msg"></p>
  </div>

  <hr class="section-rule">

  <!-- 커스텀 톤(내 문체) 등록 — 사진 선택과 무관한 전역 설정 -->
  <div id="tone-section">
    <h2>내 문체 등록</h2>
    <p class="hint">평소 쓰는 글 샘플을 등록해두면, 캡션 생성 요청 시 "내가 등록한 톤으로"라고 말해서 그 문체로 받을 수 있습니다.</p>
    <div id="tone-samples-list"></div>
    <div class="tag-add-row">
      <input id="new-tone-sample" type="text" placeholder="본인 글 샘플 한 문장 입력 후 Enter" />
      <button id="add-tone-sample">추가</button>
    </div>
  </div>

  <hr class="section-rule">

  <!-- 사진을 고르지 않았을 때: 사진 검색 -->
  <div id="general">
    <h2>사진 검색</h2>
    <div id="selected-info">원하는 사진을 자연어로 설명해서 찾아보세요</div>
    <input id="question" type="text" placeholder="예: 바다 사진 보여줘" />
    <button id="send">검색</button>
    <div id="result"></div>
  </div>

<script>
let photosById = {};
let selectedId = null;
const DEFAULT_GUIDE = '2문장으로, 담백한 사실 설명 톤으로 써줘';

document.getElementById('dateline').textContent = new Date().toLocaleDateString('ko-KR', {
  year: 'numeric', month: 'long', day: 'numeric', weekday: 'long',
});

async function loadPhotos() {
  const res = await fetch('/data/photos.json');
  const photos = await res.json();
  photosById = Object.fromEntries(photos.map(p => [p.id, p]));
  renderPhotos();
}

async function syncPhotos() {
  const msgEl = document.getElementById('sync-msg');
  msgEl.textContent = '확인 중...';
  try {
    const res = await fetch('/photos/sync', { method: 'POST' });
    const added = await res.json();
    if (added.length) {
      msgEl.textContent = `${added.length}장 새로 등록됨: ${added.map(p => p.id).join(', ')}`;
    } else {
      msgEl.textContent = '새로 등록할 사진 없음';
    }
    await loadPhotos();
  } catch (err) {
    msgEl.textContent = `실패: ${err}`;
  }
}

function renderPhotos() {
  const container = document.getElementById('photos');
  container.innerHTML = '';
  Object.values(photosById).forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-item';

    const img = document.createElement('img');
    img.src = `/data/${p.filename}`;
    img.alt = p.caption || `사진 ${p.id}`;
    img.tabIndex = 0;
    img.setAttribute('role', 'button');
    if (p.id === selectedId) img.classList.add('selected');
    img.onclick = () => selectPhoto(p.id);
    img.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectPhoto(p.id); }
    };

    const badge = document.createElement('span');
    const done = !!p.caption;
    badge.className = 'badge ' + (done ? 'done' : 'todo');
    badge.textContent = done ? '완료' : '미작업';

    const label = document.createElement('div');
    label.className = 'id-label';
    label.textContent = p.id;

    wrap.appendChild(img);
    wrap.appendChild(badge);
    wrap.appendChild(label);
    container.appendChild(wrap);
  });
}

function selectPhoto(id) {
  selectedId = id;
  renderPhotos();
  showPanel();
}

function showPanel() {
  document.getElementById('general').hidden = true;
  const panel = document.getElementById('panel');
  panel.hidden = false;

  const photo = photosById[selectedId];
  document.getElementById('panel-photo').src = `/data/${photo.filename}`;
  document.getElementById('panel-title').textContent = `선택된 사진: ${selectedId}`;
  const statusEl = document.getElementById('panel-status');
  const done = !!photo.caption;
  statusEl.textContent = done ? '이미 문장이 생성된 사진입니다 (다시 생성하거나 바로 고칠 수 있습니다)' : '아직 문장을 생성하지 않은 사진입니다';
  statusEl.className = done ? 'done' : 'todo';

  document.getElementById('guide').value = DEFAULT_GUIDE;
  document.getElementById('caption-box').value = photo.caption || '';
  document.getElementById('panel-msg').textContent = '';
  document.getElementById('new-tag').value = '';
  renderTags();
}

function renderTags() {
  const photo = photosById[selectedId];
  const container = document.getElementById('tags-list');
  container.innerHTML = '';
  (photo.tags || []).forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    const text = document.createElement('span');
    text.textContent = tag;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.onclick = () => removeTag(tag);
    chip.appendChild(text);
    chip.appendChild(removeBtn);
    container.appendChild(chip);
  });
  if (!(photo.tags || []).length) {
    container.innerHTML = '<span style="color:var(--color-muted); font-size:0.85rem;">태그 없음</span>';
  }
}

async function saveTags(tags) {
  const msgEl = document.getElementById('panel-msg');
  try {
    const res = await fetch(`/photos/${selectedId}/tags`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tags }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const updated = await res.json();
    photosById[selectedId] = updated;
    renderTags();
  } catch (err) {
    msgEl.textContent = `태그 저장 실패: ${err}`;
  }
}

function addTag() {
  const input = document.getElementById('new-tag');
  const value = input.value.trim();
  if (!value) return;
  const photo = photosById[selectedId];
  const tags = photo.tags || [];
  if (tags.includes(value)) { input.value = ''; return; }
  saveTags([...tags, value]);
  input.value = '';
}

function removeTag(tag) {
  const photo = photosById[selectedId];
  const tags = (photo.tags || []).filter(t => t !== tag);
  saveTags(tags);
}

function deselect() {
  selectedId = null;
  document.getElementById('panel').hidden = true;
  document.getElementById('general').hidden = false;
  renderPhotos();
}

async function generateCaption() {
  const guide = document.getElementById('guide').value.trim();
  const request = guide || DEFAULT_GUIDE;
  const msgEl = document.getElementById('panel-msg');
  msgEl.textContent = '생성 중...';

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: `${selectedId}::${request}` }),
    });
    const data = await res.json();
    document.getElementById('caption-box').value = data.answer ?? '';
    msgEl.textContent = '생성됨 — 내용을 확인·수정한 뒤 확정을 눌러주세요 (아직 저장 전입니다)';
  } catch (err) {
    msgEl.textContent = `생성 실패: ${err}`;
  }
}

async function confirmCaption() {
  const caption = document.getElementById('caption-box').value;
  const msgEl = document.getElementById('panel-msg');
  msgEl.textContent = '저장 중...';

  try {
    const res = await fetch(`/photos/${selectedId}/caption`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const updated = await res.json();
    photosById[selectedId] = updated;
    msgEl.textContent = '확정 저장됨';
    renderPhotos();
    showPanel();
  } catch (err) {
    msgEl.textContent = `저장 실패: ${err}`;
  }
}

async function sendGeneralQuery() {
  const text = document.getElementById('question').value.trim();
  if (!text) return;

  const resultEl = document.getElementById('result');
  resultEl.innerHTML = '<p>요청 중...</p>';

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text }),
    });
    const data = await res.json();
    const mentionedIds = [...new Set((data.answer ?? '').match(/p\d{3}/g) || [])];
    const thumbsHtml = mentionedIds
      .filter(id => photosById[id])
      .map(id => `
        <div style="display:inline-block; text-align:center; margin: 0 8px 8px 0;">
          <img src="/data/${photosById[id].filename}" alt="${photosById[id].caption || id}" style="width:100px; height:100px; object-fit:cover; border-radius:4px; display:block;" />
          <span style="font-size:0.7rem; color:var(--color-muted);">${id}</span>
        </div>
      `)
      .join('');

    resultEl.innerHTML = `
      <div id="answer"><strong>answer</strong><br>${data.answer ?? ''}</div>
      ${thumbsHtml ? `<div style="margin-top:0.75rem;">${thumbsHtml}</div>` : ''}
      <p><strong>contexts</strong></p>
      <pre>${JSON.stringify(data.contexts ?? [], null, 2)}</pre>
      <p><strong>trace</strong></p>
      <pre>${JSON.stringify(data.trace ?? [], null, 2)}</pre>
    `;
  } catch (err) {
    resultEl.innerHTML = `<p style="color:var(--color-danger)">요청 실패: ${err}</p>`;
  }
}

document.getElementById('generate').addEventListener('click', generateCaption);
document.getElementById('confirm').addEventListener('click', confirmCaption);
document.getElementById('deselect').addEventListener('click', deselect);
document.getElementById('add-tag').addEventListener('click', addTag);
document.getElementById('new-tag').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTag();
});
document.getElementById('send').addEventListener('click', sendGeneralQuery);
document.getElementById('question').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendGeneralQuery();
});

let toneSamples = [];

async function loadTones() {
  const res = await fetch('/tones');
  const tones = await res.json();
  toneSamples = tones.custom.samples || [];
  renderToneSamples();
}

function renderToneSamples() {
  const container = document.getElementById('tone-samples-list');
  container.innerHTML = '';
  if (!toneSamples.length) {
    container.innerHTML = '<span style="color:var(--color-muted); font-size:0.85rem;">등록된 샘플 없음 — 등록 전까지는 기본 톤으로 처리됩니다.</span>';
    return;
  }
  toneSamples.forEach((sample, idx) => {
    const row = document.createElement('div');
    row.className = 'tone-sample-row';
    const text = document.createElement('span');
    text.textContent = sample;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '삭제';
    removeBtn.onclick = () => removeToneSample(idx);
    row.appendChild(text);
    row.appendChild(removeBtn);
    container.appendChild(row);
  });
}

async function saveToneSamples() {
  const res = await fetch('/tones/custom', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ samples: toneSamples }),
  });
  const tones = await res.json();
  toneSamples = tones.custom.samples || [];
  renderToneSamples();
}

function addToneSample() {
  const input = document.getElementById('new-tone-sample');
  const value = input.value.trim();
  if (!value) return;
  toneSamples = [...toneSamples, value];
  input.value = '';
  saveToneSamples();
}

function removeToneSample(idx) {
  toneSamples = toneSamples.filter((_, i) => i !== idx);
  saveToneSamples();
}

document.getElementById('add-tone-sample').addEventListener('click', addToneSample);
document.getElementById('new-tone-sample').addEventListener('keydown', e => {
  if (e.key === 'Enter') addToneSample();
});
document.getElementById('sync-photos').addEventListener('click', syncPhotos);

loadPhotos();
loadTones();
</script>
</body>
</html>
